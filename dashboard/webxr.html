<!--
  File: webxr.html
  Version: 2.0.0
  Date: 2026-05-12
  Description: WebXR ADS-B visualization with live MQTT data feed.
  Supports: Quest 3 (VR), Mobile (Magic Window + AR), Desktop
  Merged: smooth lerp, altitude stems, click-to-inspect, nose cones,
          platform detection, thumbstick nav, range rings, FPS counter.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Securing Skies — 3D ADS-B Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #01030c; overflow: hidden; }
    #hud {
      position: fixed; top: 10px; left: 10px; color: #0f0; font: 12px monospace;
      z-index: 9999; background: rgba(0,0,0,0.8); padding: 8px 10px; border-radius: 6px;
      border: 1px solid rgba(0,200,255,0.25); pointer-events: none;
    }
    #help {
      position: fixed; bottom: 10px; right: 10px; color: #aaa; font: 11px monospace;
      z-index: 9999; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1); max-width: 200px; pointer-events: none;
    }
    #selection {
      position: fixed; top: 10px; right: 10px; color: #d6f7ff; font: 12px monospace;
      z-index: 9999; background: rgba(3,7,18,0.85); padding: 10px 12px; border-radius: 8px;
      border: 1px solid rgba(0,200,255,0.35); min-width: 220px; display: none;
    }
    #selection .close { cursor: pointer; float: right; color: #666; }
    .a-enter-vr, .a-enter-ar,
    .a-enter-vr-button, .a-enter-ar-button {
      right: auto !important;
      left: 50% !important;
      bottom: calc(12px + env(safe-area-inset-bottom)) !important;
      transform: translateX(-50%) !important;
      position: fixed !important;
    }
    .a-enter-vr, .a-enter-vr-button { margin-left: -35px !important; }
    .a-enter-ar, .a-enter-ar-button { margin-left: 35px !important; }
    #ios-fs-btn {
      display: none; position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: calc(10px + env(safe-area-inset-left));
      z-index: 99999; padding: 8px 14px; border: 1px solid #38bdf8; border-radius: 8px;
      background: rgba(0,0,0,0.8); color: #38bdf8; font: bold 13px monospace; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud">Connecting...</div>
  <button id="ios-fs-btn" onclick="document.documentElement.requestFullscreen?.()||document.documentElement.webkitRequestFullscreen?.();this.style.display='none'">🥽 Enter 3D View</button>
  <div id="help"></div>
  <div id="selection"><span class="close" onclick="clearSelection()">✕</span><div id="sel-content"></div></div>

  <a-scene background="color: #020617" renderer="antialias: true"
           xr-mode-ui="enabled: true; enterAREnabled: true"
           webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
           cursor="rayOrigin: mouse" raycaster="objects: .pickable">

    <a-entity id="rig" position="0 15 35">
      <a-camera id="cam" camera="fov: 78"
                look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"
                wasd-controls="acceleration: 80; fly: true"
                position="0 0 0">
        <a-entity cursor="fuse: true; fuseTimeout: 1500" raycaster="objects: .pickable; far: 200"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                  material="color: #38bdf8; shader: flat">
        </a-entity>
      </a-camera>
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .pickable"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .pickable"></a-entity>
    </a-entity>

    <!-- Ground + range rings -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#061126" opacity="0.95"></a-plane>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="49.5" radius-outer="50" color="#1f2937" segments-theta="64"></a-ring>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="99.5" radius-outer="100" color="#111827" segments-theta="64"></a-ring>
    <a-text value="50km" position="50 0.1 0" rotation="-90 0 0" color="#475569" scale="3 3 3"></a-text>
    <a-text value="100km" position="100 0.1 0" rotation="-90 0 0" color="#334155" scale="3 3 3"></a-text>

    <!-- Sensor markers (clickable) -->
    <a-cylinder class="pickable" data-sensor="sensor-north" position="0 1 0" radius="0.9" height="2" color="#0072B2" emissive="#0072B2" emissive-intensity="0.2"></a-cylinder>
    <a-text value="NORTH" position="0 2.8 0" align="center" color="#0072B2" scale="2 2 2"></a-text>

    <a-cylinder class="pickable" data-sensor="sensor-west" position="-18 1 -21" radius="0.9" height="2" color="#009E73" emissive="#009E73" emissive-intensity="0.2"></a-cylinder>
    <a-text value="WEST" position="-18 2.8 -21" align="center" color="#009E73" scale="2 2 2"></a-text>

    <a-cylinder class="pickable" data-sensor="sensor-east" position="24 1 6" radius="0.9" height="2" color="#D55E00" emissive="#D55E00" emissive-intensity="0.2"></a-cylinder>
    <a-text value="EAST" position="24 2.8 6" align="center" color="#D55E00" scale="2 2 2"></a-text>

    <!-- Aircraft populated dynamically -->
    <a-entity id="aircraft-container"></a-entity>

    <!-- Lighting -->
    <a-light type="ambient" color="#5b7fa8" intensity="0.5"></a-light>
    <a-light type="directional" position="-0.3 1 0.2" intensity="0.6" color="#fff"></a-light>
  </a-scene>

  <script>
  (function() {
    const MQTT_URL = 'wss://mqtt.securingskies.eu:8443';
    const params = new URLSearchParams(window.location.search);
    const MQTT_USER = params.get('u') || 'team9';
    const MQTT_PASS = params.get('p') || '{{MQTT_PASS}}';

    const REF_LAT = 60.319555;
    const REF_LON = 24.830816;
    const ALT_EXAG = 4;
    const STALE_MS = 70000;
    const THRESHOLD = 0.04;

    // Platform detection
    const isQuest = /OculusBrowser|Quest/i.test(navigator.userAgent);
    const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    const maxAircraft = isQuest ? 300 : (isMobile ? 80 : 200);
    const lerpFactor = isMobile ? 0.16 : 0.12;

    // Help text
    const helpEl = document.getElementById('help');
    helpEl.innerHTML = isQuest
      ? '<b>Quest 3</b><br>Controllers: aim + click<br>Thumbstick: move'
      : isMobile
        ? '<b>Mobile</b><br>Tilt: look around<br>Tap: select aircraft'
        : '<b>Desktop</b><br>🖱️ Drag: look<br>⌨️ WASD: move, Q/E: up/down<br>Click: select aircraft';

    // iOS fallback
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) document.getElementById('ios-fs-btn').style.display = 'block';

    const container = document.getElementById('aircraft-container');
    const hud = document.getElementById('hud');
    const selPanel = document.getElementById('selection');
    const selContent = document.getElementById('sel-content');
    const cam = document.getElementById('cam');
    const rig = document.getElementById('rig');

    const aircraft = new Map();
    let selectedHex = null;
    let msgCount = 0;
    let frameCount = 0, fps = 0, fpsTimer = performance.now();
    const camPos = new THREE.Vector3();

    function geoToLocal(lat, lon, alt_ft) {
      const x = (lon - REF_LON) * 111.32 * Math.cos(REF_LAT * Math.PI / 180);
      const z = -(lat - REF_LAT) * 111.32;
      const y = ((alt_ft || 0) / 3281) * ALT_EXAG;
      return { x, y, z };
    }

    function scoreToColor(score) {
      if (score == null) return '#00ffaa';
      const t = Math.min(Math.max(score / THRESHOLD, 0), 1);
      return `rgb(${Math.round(40 + 215*t)}, ${Math.round(220 - 170*t)}, ${Math.round(95 - 55*t)})`;
    }

    // 3D popup label (visible in both flat and VR/AR)
    const popup = document.createElement('a-entity');
    popup.setAttribute('id', 'popup3d');
    popup.setAttribute('visible', 'false');
    popup.innerHTML = `
      <a-plane width="6" height="2" color="#000" opacity="0.85" position="0 0 0"></a-plane>
      <a-text id="popup-text" value="" color="#fff" align="center" position="0 0 0.01" scale="2.5 2.5 2.5" wrap-count="30"></a-text>
    `;
    document.querySelector('a-scene').appendChild(popup);

    function showPopup3D(text, position) {
      popup.setAttribute('position', `${position.x} ${position.y + 3} ${position.z}`);
      popup.querySelector('#popup-text').setAttribute('value', text);
      popup.setAttribute('visible', 'true');
      // Auto-hide after 4 seconds
      if (popup._timeout) clearTimeout(popup._timeout);
      popup._timeout = setTimeout(hidePopup3D, 4000);
    }

    function hidePopup3D() {
      popup.setAttribute('visible', 'false');
      popup._lastHidden = Date.now();
    }

    window.clearSelection = function() {
      selectedHex = null;
      selPanel.style.display = 'none';
      hidePopup3D();
    };

    // Sensor click — show node name as 3D popup
    document.querySelectorAll('[data-sensor]').forEach(el => {
      el.addEventListener('click', () => {
        if (popup._lastHidden && Date.now() - popup._lastHidden < 2000) return;
        const name = el.getAttribute('data-sensor');
        const pos = el.getAttribute('position');
        selContent.innerHTML = `<b>${name}</b>`;
        selPanel.style.display = 'block';
        showPopup3D(name, pos);
      });
    });

    function showSelection(hex) {
      if (popup._lastHidden && Date.now() - popup._lastHidden < 2000) return;
      const item = aircraft.get(hex);
      if (!item) return;
      selectedHex = hex;
      const s = item.score;
      const status = s == null ? 'Normal' : s > THRESHOLD ? '!! ANOMALY' : s > 0.02 ? '! Elevated' : 'Normal';
      const text = `${(item.flight || hex).toUpperCase()}\nNode: ${item.sensor || '-'}\nAlt: ${item.alt || '-'} ft\nScore: ${s != null ? s.toFixed(5) : '-'} ${status}`;
      // DOM panel (flat view)
      selContent.innerHTML = text.replace(/\n/g, '<br>');
      selPanel.style.display = 'block';
      // 3D popup (VR/AR)
      showPopup3D(text, item.current);
    }

    function upsertAircraft(sensor, ac) {
      if (!ac || !ac.hex || !ac.lat || !ac.lon) return;
      const hex = ac.hex.toLowerCase();
      const target = geoToLocal(ac.lat, ac.lon, ac.alt_baro);
      const now = performance.now();

      let item = aircraft.get(hex);
      if (!item) {
        // Evict oldest if at capacity
        if (aircraft.size >= maxAircraft) {
          let oldestK = null, oldestT = Infinity;
          for (const [k, v] of aircraft) { if (v.lastSeen < oldestT) { oldestK = k; oldestT = v.lastSeen; } }
          if (oldestK) { aircraft.get(oldestK).el.remove(); aircraft.delete(oldestK); }
        }

        const el = document.createElement('a-entity');
        el.dataset.hex = hex;
        el.setAttribute('position', `${target.x} ${target.y} ${target.z}`);

        // Sphere body — this is the clickable target
        const body = document.createElement('a-sphere');
        body.classList.add('pickable');
        body.setAttribute('radius', isMobile ? '0.4' : '0.5');
        body.setAttribute('color', '#00ffaa');
        body.setAttribute('emissive', '#00ffaa');
        body.setAttribute('emissive-intensity', '0.25');
        body.setAttribute('class', 'pickable');
        body.addEventListener('click', () => showSelection(hex));
        body.addEventListener('mousedown', () => showSelection(hex));

        // Nose cone (direction indicator)
        const nose = document.createElement('a-cone');
        nose.setAttribute('height', '0.35');
        nose.setAttribute('radius-bottom', '0.12');
        nose.setAttribute('radius-top', '0.01');
        nose.setAttribute('color', '#b5fef0');
        nose.setAttribute('position', '0.3 0 0');
        nose.setAttribute('rotation', '0 0 -90');

        // Altitude stem
        const stem = document.createElement('a-cylinder');
        const stemH = Math.max(target.y, 0.1);
        stem.setAttribute('radius', '0.02');
        stem.setAttribute('height', stemH);
        stem.setAttribute('position', `0 ${-stemH/2} 0`);
        stem.setAttribute('color', '#164e63');
        stem.setAttribute('opacity', '0.5');

        // Label
        const label = document.createElement('a-text');
        label.setAttribute('value', ac.flight || hex.toUpperCase());
        label.setAttribute('color', '#e2e8f0');
        label.setAttribute('align', 'center');
        label.setAttribute('position', '0 0.7 0');
        label.setAttribute('scale', isMobile ? '1.3 1.3 1.3' : '1.6 1.6 1.6');

        el.appendChild(stem);
        el.appendChild(body);
        el.appendChild(nose);
        el.appendChild(label);
        container.appendChild(el);

        item = { el, body, stem, label, current: new THREE.Vector3(target.x, target.y, target.z),
                 target: new THREE.Vector3(target.x, target.y, target.z),
                 score: null, lastSeen: now, sensor, flight: ac.flight||'', alt: ac.alt_baro, gs: ac.gs };
        aircraft.set(hex, item);
      } else {
        item.target.set(target.x, target.y, target.z);
        item.lastSeen = now;
        item.sensor = sensor;
        item.flight = ac.flight || item.flight;
        item.alt = ac.alt_baro;
        item.gs = ac.gs;
        if (ac.flight) item.label.setAttribute('value', ac.flight);
      }
    }

    // VR/AR: reposition rig so you see the same view as flat mode
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('enter-vr', () => {
      rig.setAttribute('position', '0 12 0');
    });
    sceneEl.addEventListener('exit-vr', () => {
      rig.setAttribute('position', '0 15 35');
    });

    // Thumbstick movement for Quest controllers
    function attachThumbstick(controller) {
      controller.addEventListener('thumbstickmoved', (e) => {
        const {x, y} = e.detail || {};
        if (Math.abs(x) < 0.1 && Math.abs(y) < 0.1) return;
        rig.object3D.position.x += x * 0.5;
        rig.object3D.position.z += y * 0.5;
      });
    }
    attachThumbstick(document.getElementById('leftHand'));
    attachThumbstick(document.getElementById('rightHand'));

    // Animation loop — lerp positions, update stems, billboard labels
    function tick() {
      const now = performance.now();
      cam.object3D.getWorldPosition(camPos);

      for (const [hex, item] of aircraft) {
        // Smooth movement
        item.current.lerp(item.target, lerpFactor);
        item.el.object3D.position.copy(item.current);

        // Update stem
        const h = Math.max(item.current.y, 0.1);
        item.stem.setAttribute('height', h);
        item.stem.object3D.position.y = -h/2;

        // Billboard label
        item.label.object3D.lookAt(camPos);

        // Remove stale
        if (now - item.lastSeen > STALE_MS) {
          if (selectedHex === hex) window.clearSelection();
          item.el.remove();
          aircraft.delete(hex);
        }
      }

      // FPS
      frameCount++;
      if (now - fpsTimer >= 1000) {
        fps = Math.round(frameCount * 1000 / (now - fpsTimer));
        frameCount = 0; fpsTimer = now;
        hud.textContent = `LIVE | ${aircraft.size} aircraft | ${msgCount} msgs | ${fps} fps`;
      }
      requestAnimationFrame(tick);
    }
    tick();

    // MQTT
    if (!MQTT_USER || !MQTT_PASS) {
      hud.textContent = 'No credentials — add ?u=USER&p=PASS to URL';
      hud.style.color = '#f59e0b';
    } else {
      const client = mqtt.connect(MQTT_URL, { username: MQTT_USER, password: MQTT_PASS, rejectUnauthorized: false });

    client.on('connect', () => {
      hud.textContent = 'LIVE — Connected';
      client.subscribe('+/aircraft');
      client.subscribe('sensor-core/ml-anomaly');
    });

    client.on('message', (topic, message) => {
      let payload;
      try { payload = JSON.parse(message.toString()); } catch { return; }

      if (topic.includes('/aircraft')) {
        const sensor = topic.split('/')[0];
        (payload.aircraft || []).forEach(ac => upsertAircraft(sensor, ac));
        msgCount++;
      }

      if (topic === 'sensor-core/ml-anomaly' && payload.hex) {
        const hex = payload.hex.toLowerCase();
        const item = aircraft.get(hex);
        if (item) {
          const score = Number(payload.anomaly_score);
          if (!isNaN(score)) {
            item.score = score;
            const color = scoreToColor(score);
            item.body.setAttribute('color', color);
            item.body.setAttribute('emissive', color);
            if (score > THRESHOLD) {
              item.el.setAttribute('animation__pulse', 'property: scale; to: 1.4 1.4 1.4; dur: 500; dir: alternate; loop: true; easing: easeInOutSine');
            } else {
              item.el.removeAttribute('animation__pulse');
              item.el.setAttribute('scale', '1 1 1');
            }
          }
        }
        if (selectedHex === hex) showSelection(hex);
      }
    });

    client.on('reconnect', () => { hud.textContent = 'Reconnecting...'; });
    client.on('error', () => { hud.textContent = 'MQTT Error'; });
    } // end credentials check
  })();
  </script>
</body>
</html>
